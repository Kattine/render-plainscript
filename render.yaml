services:
  - type: web
    name: plainscript
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false          # fill this in Render dashboard
      - key: ADAPTER_ID
        value: zkmine/plainscript-adapter
    plan: free
